[workspace]
members = ["cargo:."]

# Release builds with cargo-dist. `dist generate` rewrites .github/workflows/release.yml from this.
[dist]
cargo-dist-version = "0.34.0"
ci = "github"
hosting = "github"
installers = ["shell", "homebrew"]
tap = "frodi-karlsson/homebrew-tap"
publish-jobs = ["homebrew"]
# The host-only targets from the spec. No Windows.
targets = [
    "aarch64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
]
install-path = "CARGO_HOME"
install-updater = false
# Runs each built `entropy` on its own platform before anything is published.
global-artifacts-jobs = ["./smoke"]
# release.yml has hand edits for actionlint and zizmor, listed at its top.
allow-dirty = ["ci"]

# Every action pinned to the commit of its latest release.
[dist.github-action-commits]
"actions/checkout" = "3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
"actions/upload-artifact" = "cf430e030ddbb5b0abf93d22962f4752f3646cd9" # v7.0.2
"actions/download-artifact" = "9000827ccba6bdab643e8b6fd33ac0654aef8333" # v8.0.2
"actions/attest" = "1e69f48acb82d1966a394da916b4c1698aa569d6" # v4.2.2
"swatinem/rust-cache" = "d1527c8f67ef9af357290475d4af4b0fab8f12e0" # v2.9.3
