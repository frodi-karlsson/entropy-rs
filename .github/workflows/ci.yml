name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_DENY_VERSION: 0.20.2
  ZIZMOR_VERSION: 1.32.0
  ACTIONLINT_VERSION: 1.7.12

jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-${{ runner.os }}-${{ env.CARGO_DENY_VERSION }}
      - run: command -v cargo-deny || cargo install cargo-deny --locked --version "$CARGO_DENY_VERSION"
      - run: cargo deny check

  lint-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/zizmor
            ~/go/bin/actionlint
          key: workflow-lint-${{ runner.os }}-${{ env.ZIZMOR_VERSION }}-${{ env.ACTIONLINT_VERSION }}
      - run: command -v zizmor || cargo install zizmor --locked --version "$ZIZMOR_VERSION"
      - run: test -x ~/go/bin/actionlint || go install "github.com/rhysd/actionlint/cmd/actionlint@v$ACTIONLINT_VERSION"
      - run: ~/go/bin/actionlint
      - run: zizmor .github/workflows
        env:
          GH_TOKEN: ${{ github.token }}
