[package]
name = "entropy-lang-codegen"
description = "Cranelift code generator for the Entropy language"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "entropy_codegen"

[lints]
workspace = true

[dependencies]
cranelift-codegen = "=0.137.1"
cranelift-frontend = "=0.137.1"
cranelift-jit = "=0.137.1"
cranelift-module = "=0.137.1"
entropy-lang-runtime = { path = "../entropy-runtime", version = "0.1.0", features = ["capi"] }
entropy-lang-sema = { path = "../entropy-sema", version = "0.1.0" }

[dev-dependencies]
insta = "1.49.0"
