[package]
name = "entropy-lang"
description = "A compiler for Entropy, the language where data decays as it is used"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "entropy"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
entropy-lang-sema = { path = "../entropy-sema", version = "0.1.0" }
entropy-lang-syntax = { path = "../entropy-syntax", version = "0.1.0" }

[dev-dependencies]
libtest-mimic = "0.8.2"
entropy-reference = { path = "../entropy-reference" }

[[test]]
name = "golden"
harness = false
