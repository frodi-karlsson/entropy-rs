[package]
name = "entropy-lang"
description = "A compiler for Entropy, the language where data decays as it is used"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[[bin]]
name = "entropy"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
entropy-lang-codegen = { path = "../entropy-codegen", version = "0.1.0" }
# Listed directly, for its C ABI and so this crate's build script gets its `links` metadata.
entropy-lang-runtime = { path = "../entropy-runtime", version = "0.1.0", features = ["capi"] }
entropy-lang-sema = { path = "../entropy-sema", version = "0.1.0" }
entropy-lang-syntax = { path = "../entropy-syntax", version = "0.1.0" }

[dev-dependencies]
libtest-mimic = "0.8.2"
proptest = "1.12.0"
entropy-reference = { path = "../entropy-reference" }

[[test]]
name = "golden"
harness = false
