[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/frodi-karlsson/entropy-rs"
keywords = ["esolang", "entropy", "compiler", "cranelift", "jit"]
categories = ["compilers", "command-line-utilities"]

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

# Release binaries, built by cargo-dist.
[profile.dist]
inherits = "release"
lto = "thin"
